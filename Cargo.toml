[package]
name = "udpcast"
version = "1.0.0"
edition = "2021"
description = "Safe Rust implementation of udpcast - UDP file/multicasting tool"
license = "GPL-2.0"
readme = "README.md"

[[bin]]
name = "udp-sender"
path = "src/bin/sender_main.rs"

[[bin]]
name = "udp-receiver"
path = "src/bin/receiver_main.rs"

[lib]
name = "udpcast"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.29", features = ["term", "net", "ioctl", "poll", "process", "fs", "signal", "uio"] }
socket2 = "0.5"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
